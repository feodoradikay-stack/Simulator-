function createBulletHole(point, normal){
  if(bulletHoles.length >= maxHoles){ const old = bulletHoles.shift(); scene.remove(old.hole); scene.remove(old.scorch); }
  const hole = new THREE.Mesh(holeGeo, holeMat.clone());
  hole.position.copy(point).addScaledVector(normal, 0.005);
  hole.lookAt(point.clone().add(normal)); scene.add(hole);
  const scorch = new THREE.Mesh(scorchGeo, scorchMat.clone());
  scorch.position.copy(point).addScaledVector(normal, 0.004);
  scorch.lookAt(point.clone().add(normal)); scene.add(scorch);
  bulletHoles.push({ hole, scorch });
}

const joystick = document.getElementById('joystick');
const knob = joystick.querySelector('.knob');
let joyId = null, joyCenter = {x:0,y:0};

joystick.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyId = t.identifier;
  const r = joystick.getBoundingClientRect();
  joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 };
  updateJoy(t.clientX, t.clientY);
}, {passive:false});

joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === joyId){ updateJoy(t.clientX, t.clientY); break; }
  }
}, {passive:false});

const endJoy = e => {
  for(const t of e.changedTouches){
    if(t.identifier === joyId){
      joyId = null;
      knob.style.transform = 'translate(-50%,-50%)';
      state.moveX = 0; state.moveZ = 0;
    }
  }
};
joystick.addEventListener('touchend', endJoy);
joystick.addEventListener('touchcancel', endJoy);

function updateJoy(x, y){
  const dx = x - joyCenter.x, dy = y - joyCenter.y;
  const max = 45;
  const dist = Math.min(Math.sqrt(dx*dx+dy*dy), max);
  const ang = Math.atan2(dy, dx);
  const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
  knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  state.moveX = kx/max;
  state.moveZ = ky/max;
}

const lookZone = document.getElementById('lookZone');
let lookId = null, lookLast = {x:0,y:0};
let kickSwipeStart = null;

lookZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  lookId = t.identifier;
  lookLast = {x:t.clientX, y:t.clientY};
  if(state.onMoto && !state.motoRunning){
    kickSwipeStart = { x: t.clientX, y: t.clientY, time: Date.now() };
  }
}, {passive:false});

lookZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === lookId){
      const dx = t.clientX - lookLast.x;
      const dy = t.clientY - lookLast.y;
      state.yaw -= dx*0.004;
      state.pitch -= dy*0.004;
      state.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, state.pitch));
      lookLast = {x:t.clientX, y:t.clientY};
      
      if(kickSwipeStart && state.onMoto && !state.motoRunning){
        const swipeDist = t.clientY - kickSwipeStart.y;
        if(swipeDist > 80){
          startEngine();
          kickSwipeStart = null;
        }
      }
    }
  }
}, {passive:false});

let audioCtx = null;
let engineOsc = null, engineGain = null;

function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function startEngineSound(){
  try {
    const ctx = getAudio();
    engineOsc = ctx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 30;
    engineGain = ctx.createGain();
    engineGain.gain.value = 0.1;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    engineOsc.connect(filter);
    filter.connect(engineGain);
    engineGain.connect(ctx.destination);
    engineOsc.start();
  } catch(e){}
}

function updateEngineSound(rpm){
  if(engineOsc && engineGain){
    engineOsc.frequency.value = 20 + rpm * 0.05;
    engineGain.gain.value = 0.05 + rpm * 0.001;
  }
}

function stopEngineSound(){
  if(engineOsc){
    engineOsc.stop();
    engineOsc = null;
    engineGain = null;
  }
}

function playShotSound(){
  try {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const bufferSize = ctx.sampleRate * 0.3;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      const t = i/bufferSize;
      data[i] = (Math.random()*2-1) * Math.exp(-t*15) * 0.8;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 800;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.6, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(now);
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.5, now);
    oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  } catch(e){}
}

function playReloadSound(){
  try {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  } catch(e){}
}

function playEmptySound(){
  try {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 150;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } catch(e){}
}

function startEngine(){
  if(state.motoRunning) return;
  state.motoRunning = true;
  state.motoRPM = 800;
  startEngineSound();
  showMessage('ДВИГАТЕЛЬ ЗАВЕДЁН!');

function stopEngine(){
  state.motoRunning = false;

  stopEngineSound();
  showMessage('ДВИГАТЕЛЬ ЗАГЛУШЕН');
  document.getElementById('rpm').style.display = 'none';
}

function toggleMoto(){
  const dist = camera.position.distanceTo(motoPosition);
  if(state.onMoto){
    state.onMoto = false;
    if(state.motoRunning) stopEngine();
    camera.position.set(motoPosition.x + 2, 1.6, motoPosition.z + 2);
    document.getElementById('motoBtn').textContent = '🏍 СЕСТЬ';
    document.getElementById('kickHint').classList.remove('show');
    showMessage('ВЫ СЛЕЗЛИ С МОТОЦИКЛА');
  } else {
    if(dist > 3){
      showMessage('ПОДОЙДИТЕ БЛИЖЕ К МОТОЦИКЛУ');
      return;
    }
    state.onMoto = true;
    document.getElementById('motoBtn').textContent = '🚶 СЛЕЗТЬ';
    document.getElementById('kickHint').classList.add('show');
    showMessage('ВЫ СЕЛИ НА PLUSAR\nK - ЗАВЕСТИ • F - ЗАГЛУШИТЬ • V - ОСМОТРЕТЬ');
    setTimeout(() => document.getElementById('kickHint').classList.remove('show'), 3000);
  }
}

function toggleViewer(){
  state.viewerOpen = !state.viewerOpen;
  document.getElementById('motoViewer').style.display = state.viewerOpen ? 'block' : 'none';
}

const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);

function shoot(){
  if(state.ammo <= 0){ playEmptySound(); showMessage('НЕТ ПАТРОНОВ!'); return; }
  if(state.reloading) return;
  state.ammo--;
  state.recoil = 1.0;
  updateAmmo();
  playShotSound();
  muzzleFlash.material.opacity = 1.0;
  shotLight.intensity = 8;
  document.getElementById('flash').style.opacity = '0.3';
  setTimeout(() => { document.getElementById('flash').style.opacity = '0'; }, 50);
  raycaster.setFromCamera(center, camera);
  const intersects = raycaster.intersectObjects(paintables, false);
  if(intersects.length > 0){
    const hit = intersects[0];
    createBulletHole(hit.point, hit.face.normal.clone().transformDirection(hit.object.matrixWorld));
  }
  if(state.ammo <= 0) setTimeout(() => reload(), 800);
}

function reload(){
  if(state.reloading || state.ammo === state.maxAmmo) return;
  state.reloading = true;
  playReloadSound();
  showMessage('ПЕРЕЗАРЯДКА...');
  document.getElementById('reloadBtn').disabled = true;
  setTimeout(() => {
    state.ammo = state.maxAmmo;
    state.reloading = false;
    updateAmmo();
    showMessage('ГОТОВ К СТРЕЛЬБЕ');
    document.getElementById('reloadBtn').disabled = false;
  }, 1500);
}

function updateAmmo(){
  const ammoEl = document.getElementById('ammo');
  if(state.hasGun){
    ammoEl.style.display = 'block';
    ammoEl.textContent = `ПАТРОНЫ: ${'●'.repeat(state.ammo)}${'○'.repeat(state.maxAmmo - state.ammo)}`;
    document.getElementById('reloadBtn').style.display = state.ammo < state.maxAmmo ? 'block' : 'none';
  } else {
    ammoEl.style.display = 'none';
    document.getElementById('reloadBtn').style.display = 'none';
  }
}

function showMessage(text){

}

const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps');
let frameCount = 0, lastFpsTime = 0;
const forward = new THREE.Vector3();
const right = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  frameCount++;
  if(t - lastFpsTime >= 1){
    fpsEl.textContent = frameCount + ' FPS';
    frameCount = 0;
    lastFpsTime = t;
  }

  if(state.onMoto){
    const camOffset = new THREE.Vector3(0, 2, 3);
    camera.position.copy(motoPosition).add(camOffset);
    camera.lookAt(motoPosition.x, motoPosition.y + 1, motoPosition.z);
    
    if(state.motoRunning){
      state.motoRPM = 800 + Math.sin(t*5)*100 + Math.random()*50;
      updateEngineSound(state.motoRPM);
      document.querySelector('#rpm .value').textContent = Math.round(state.motoRPM);
    }
  } else {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = state.yaw;
    camera.rotation.x = state.pitch;

    let mx = state.moveX, mz = state.moveZ;
    if(keys['w'] || keys['arrowup']) mz = -1;
    if(keys['s'] || keys['arrowdown']) mz = 1;
    if(keys['a'] || keys['arrowleft']) mx = -1;
    if(keys['d'] || keys['arrowright']) mx = 1;

    forward.set(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    right.set(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
    camera.position.addScaledVector(forward, -mz*state.speed);
    camera.position.addScaledVector(right, mx*state.speed);

    const lim = 4.5;
    camera.position.x = Math.max(-lim, Math.min(lim, camera.position.x));
    camera.position.z = Math.max(-lim, Math.min(lim, camera.position.z));
    camera.position.y = 1.6;
    
    const distToMoto = camera.position.distanceTo(motoPosition);
    motoBtn.style.display = distToMoto < 3 ? 'block' : 'none';
  }

  flameMesh.scale.y = 1 + Math.sin(t*10)*0.2;
  candleLight.intensity = 3 + Math.sin(t*10)*0.5;

  fireLight.intensity = 3.5 + Math.sin(t*8)*0.8 + Math.sin(t*13)*0.4 + Math.random()*0.3;
  fireLight2.intensity = 1.5 + Math.sin(t*10+1)*0.5;
  fireParticles.forEach(p => {
    const d = p.userData;
    const life = ((t * d.speed + d.phase) % 1);
    p.position.y = d.baseY + life * 0.5;
    p.position.x = d.baseX + Math.sin(t*2 + d.phase)*0.05;
    p.scale.set(d.size * (1 - life*0.5), d.size * (0.5 + life*0.8), 1);
    p.material.opacity = (1 - life) * 0.9;
    p.rotation.y += dt * 2;
  });

  if(state.hasGun && !state.onMoto){
    if(state.recoil > 0){
      state.recoil -= dt * 4;
      if(state.recoil < 0) state.recoil = 0;
    }
    const bobX = Math.sin(t*1.5) * 0.005 * (Math.abs(state.moveX) + Math.abs(state.moveZ));
    const bobY = Math.abs(Math.sin(t*3)) * 0.008 * (Math.abs(state.moveX) + Math.abs(state.moveZ));
    gunGroup.position.x = 0.25 + bobX;
    gunGroup.position.y = -0.25 + bobY + state.recoil * 0.08;
    gunGroup.position.z = -0.5 + state.recoil * 0.15;
    gunGroup.rotation.x = -state.recoil * 0.3;
    gunGroup.rotation.y = -0.05 + state.recoil * 0.1;
    if(muzzleFlash.material.opacity > 0){
      muzzleFlash.material.opacity -= dt * 8;
      if(muzzleFlash.material.opacity < 0) muzzleFlash.material.opacity = 0;
    }
    if(shotLight.intensity > 0){
      shotLight.intensity -= dt * 40;
      if(shotLight.intensity < 0) shotLight.intensity = 0;
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  animate();
